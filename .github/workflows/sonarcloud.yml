name: SonarCloud for Maven Projects

on:
  workflow_call:
    inputs:
        with-submodules:
          description: "Clone repository with its submodules"
          type: boolean
          required: false
          default: false
        runs-on:
          description: "Tag for the runner to use in the main job."
          type: string
          required: false
          default: "ubuntu-latest"
    secrets:
      SONAR_TOKEN:
        required: true
          
jobs:      
  build:
    name: "SonarCloud Scan"
    runs-on: ${{ inputs.runs-on }}
    if: ${{ github.actor != 'dependabot[bot]' }}
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: ${{ inputs.with-submodules }}
        fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

    - name: Determine Java version
      id: jve
      shell: bash
      run: |
        for expr in maven.compiler.target maven.compiler.release java.version; do
          v=$(mvn -B -q -N help:evaluate -DforceStdout -Dexpression="$expr" 2>/dev/null || true)
          v=${v#1.}
          if [[ "$v" =~ ^[0-9]+ ]]; then
            echo "java_major_version=${BASH_REMATCH[0]}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        done
        echo "::error::Could not determine the Java version from the POM"
        exit 1

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ steps.jve.outputs.java_major_version }}
        cache: 'maven'

    # Maven 3.10 breaks snapshot deployment to Central (HTTP 401)
    - name: Set up Maven
      uses: stCarolas/setup-maven@v5
      with:
        maven-version: 3.9.16
                
    - name: Build and Analyze
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar --file pom.xml
